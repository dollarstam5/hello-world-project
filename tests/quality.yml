name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify foundation and secrets
        run: |
          bun run check:foundation
          bun run check:db-tests
          bun run check:pwa
          bun run check:release
          bun run security:secrets

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:run

      - name: Production build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder_000000000000
          NODE_ENV: production
        run: bun run build:check

      - name: Install Chromium for mobile validation
        run: bunx playwright install --with-deps chromium

      - name: Mobile and offline browser tests
        run: bun run test:e2e

  database-tests:
    name: Supabase RLS integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Validate database test files
        run: bun run check:db-tests

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Run pgTAP RLS tests
        run: supabase test db

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
