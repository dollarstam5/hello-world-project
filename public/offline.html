<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171a20">
    <title>Vitalis — hors connexion</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #171a20;
        color: #f4f6fa;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: calc(24px + env(safe-area-inset-top, 0px))
          calc(20px + env(safe-area-inset-right, 0px))
          calc(24px + env(safe-area-inset-bottom, 0px))
          calc(20px + env(safe-area-inset-left, 0px));
        place-items: center;
      }
      main { width: min(100%, 420px); text-align: center; }
      .mark {
        display: grid;
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        place-items: center;
        border-radius: 20px;
        background: #24466b;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
      }
      h1 { margin: 0 0 12px; font-size: clamp(24px, 6vw, 32px); }
      p { margin: 0; color: #c0c7d2; line-height: 1.6; }
      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        padding: 0 22px;
        border-radius: 14px;
        background: #5bb0ff;
        color: #101820;
        font-weight: 650;
        text-decoration: none;
      }
      .button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">V</div>
      <h1>Vous êtes momentanément hors connexion</h1>
      <p>Les pages déjà consultées restent disponibles sur cet appareil. Dès que le réseau revient, vous pourrez reprendre.</p>
      <a class="button" href="/">Réessayer</a>
    </main>
  </body>
</html>
