name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Security, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "3.0.0"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply one-time lint autofixes to reported files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          bunx eslint --fix \
            src/main.ts \
            src/components/experience/AssistantNoticeLayer.tsx \
            src/components/experience/CommunicationSheet.tsx \
            src/components/experience/HomeFoundation.tsx \
            src/components/experience/ProfileManagementPage.tsx \
            src/components/ui/badge.tsx \
            src/components/ui/button.tsx \
            src/components/ui/form.tsx \
            src/components/ui/navigation-menu.tsx \
            src/components/ui/sidebar-provider.tsx \
            src/components/ui/sidebar.tsx \
            src/components/ui/toggle.tsx \
            src/domains/access-mode/model/access-mode.tsx \
            src/domains/assistant/ui/AssistantTab.tsx \
            src/domains/flash/ui/FlashComposerReviewStep.tsx \
            src/domains/flash/ui/dashboard/FlashDashboard.tsx \
            src/domains/presence/model/reel-proximity/reel-proximity.helpers.ts \
            src/domains/presence/model/reel-proximity/useReelActivity.ts \
            src/domains/presence/model/reel-proximity/useReelBips.ts \
            src/domains/presence/model/reel-proximity/useReelConnections.ts \
            src/domains/presence/model/reel-proximity/useReelDiscovery.ts \
            src/domains/presence/model/reel-proximity/useReelGuestPresence.ts \
            src/domains/presence/model/reel-proximity/useReelLifecycle.ts \
            src/domains/presence/model/reel-proximity/useReelMemberPresence.ts \
            src/domains/presence/model/reel-proximity/useReelPanelState.ts \
            src/domains/presence/model/reel-proximity/useReelPresence.ts \
            src/domains/presence/model/useReelProximityController.ts \
            src/domains/presence/ui/components/ReelRadarIdentity.tsx \
            src/domains/presence/ui/components/ReelSettingsPanel.tsx \
            src/domains/scan/hooks/useScanFlow.ts \
            src/lib/communication/CommunicationRuntimeProvider.tsx \
            src/lib/communication/gate.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply quality lint autofixes"
            git push origin HEAD:refs/heads/fix/reel-ssr-native-controls
          fi

      - name: Verify foundation and secrets
        run: |
          bun run check:foundation
          bun run security:secrets

      - name: Database RLS tests
        run: |
          read -r DB_PORT SHADOW_PORT < <(python - <<'PY'
          import socket

          def free_port():
              with socket.socket() as sock:
                  sock.bind(("0.0.0.0", 0))
                  return sock.getsockname()[1]

          db_port = free_port()
          shadow_port = free_port()
          while shadow_port == db_port:
              shadow_port = free_port()
          print(db_port, shadow_port)
          PY
          )
          printf '\n[db]\nport = %s\nshadow_port = %s\n' "$DB_PORT" "$SHADOW_PORT" >> supabase/config.toml
          echo "Using isolated Supabase DB ports: $DB_PORT (database), $SHADOW_PORT (shadow)"
          supabase start --exclude mailpit
          bun run check:db-tests
          bun run test:db

      - name: Stop Supabase services
        if: always()
        run: supabase stop || true

      - name: Install Chromium for mobile route smoke tests
        run: bunx playwright install --with-deps chromium

      - name: Mobile production route rendering smoke tests
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder_000000000000
        run: bun run test:e2e

      - name: Upload mobile production screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-production-smoke-${{ github.run_id }}
          path: artifacts/mobile-smoke/
          if-no-files-found: warn
          retention-days: 7

      - name: Release check
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder_000000000000
          # Vite's build command selects production mode itself. Keep tests in their test environment.
        run: bun run check:release
