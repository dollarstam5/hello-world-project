name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify foundation and secrets
        run: |
          bun run check:foundation
          bun run security:secrets

      - name: Database RLS tests
        run: |
          # Pick free host ports at runtime: fixed ports can already be occupied
          # by services on a GitHub-hosted runner.
          read -r DB_PORT SHADOW_PORT < <(python - <<'PY'
          import socket

          def free_port():
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                  sock.bind(("0.0.0.0", 0))
                  return sock.getsockname()[1]

          db_port = free_port()
          shadow_port = free_port()
          while shadow_port == db_port:
              shadow_port = free_port()
          print(db_port, shadow_port)
          PY
          )
          printf '\n[db]\nport = %s\nshadow_port = %s\n' "$DB_PORT" "$SHADOW_PORT" >> supabase/config.toml
          echo "Using isolated Supabase DB ports: $DB_PORT (database), $SHADOW_PORT (shadow)"
          # RLS and migration tests do not send email; omit the optional local mail
          # service so its fixed SMTP host port cannot collide with runner services.
          supabase start --exclude mailpit
          bun run check:db-tests
          bun run test:db

      - name: Stop Supabase services
        if: always()
        run: supabase stop || true

      - name: Release check
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder_000000000000
          NODE_ENV: production
        run: bun run check:release

      - name: Install Chromium for mobile validation
        run: bunx playwright install --with-deps chromium

      - name: Mobile visual smoke screenshots
        run: bun run test:e2e

      - name: Upload mobile visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitalis-mobile-smoke
          path: artifacts/mobile-smoke/*.png
          if-no-files-found: ignore
          retention-days: 7
