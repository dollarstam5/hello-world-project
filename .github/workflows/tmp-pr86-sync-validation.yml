name: Temporary PR86 sync validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: scan-phase-a-interpreter
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format targeted files
        run: |
          bunx prettier --write \
            packages/core-contracts/src/sync-validation.ts \
            tests/sync/protocol.test.ts \
            tests/sync/transport.server.test.ts \
            tests/sync/transport.server.isolation-concurrency.test.ts
      - name: Run targeted sync tests
        run: |
          bun run test:run -- \
            tests/sync/protocol.test.ts \
            tests/sync/transport.server.test.ts \
            tests/sync/transport.server.isolation-concurrency.test.ts
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/core-contracts/src/sync-validation.ts tests/sync/protocol.test.ts tests/sync/transport.server.test.ts tests/sync/transport.server.isolation-concurrency.test.ts
            git commit -m "style(sync): format targeted validation fixes"
            git push origin HEAD:scan-phase-a-interpreter
          fi
