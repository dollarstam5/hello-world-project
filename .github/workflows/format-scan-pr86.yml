name: Temporary PR 86 formatting
on:
  push:
    branches:
      - scan-phase-a-interpreter
    paths:
      - '.github/workflows/format-scan-pr86.yml'
      - 'packages/core-db/src/flash-repository.ts'
      - 'src/domains/flash/data.ts'
      - 'src/domains/scan/hooks/useScanFlow.ts'
      - 'src/domains/scan/hooks/useScanVoiceInput.ts'
      - 'src/domains/scan/ui/ScanHistory.tsx'
      - 'src/domains/scan/ui/ScanNeedInterpretation.tsx'
      - 'src/domains/scan/ui/ScanPanel.tsx'
      - 'src/domains/scan/ui/ScanPreferences.tsx'
      - 'src/lib/i18n/messages.ts'
      - 'src/lib/sync/transport.server.ts'
      - 'tests/flash-archive-action.test.ts'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: scan-phase-a-interpreter
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format only PR 86 files
        run: bunx prettier --write packages/core-db/src/flash-repository.ts src/domains/flash/data.ts src/domains/scan/hooks/useScanFlow.ts src/domains/scan/hooks/useScanVoiceInput.ts src/domains/scan/ui/ScanHistory.tsx src/domains/scan/ui/ScanNeedInterpretation.tsx src/domains/scan/ui/ScanPanel.tsx src/domains/scan/ui/ScanPreferences.tsx src/lib/i18n/messages.ts src/lib/sync/transport.server.ts tests/flash-archive-action.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core-db/src/flash-repository.ts src/domains/flash/data.ts src/domains/scan/hooks/useScanFlow.ts src/domains/scan/hooks/useScanVoiceInput.ts src/domains/scan/ui/ScanHistory.tsx src/domains/scan/ui/ScanNeedInterpretation.tsx src/domains/scan/ui/ScanPanel.tsx src/domains/scan/ui/ScanPreferences.tsx src/lib/i18n/messages.ts src/lib/sync/transport.server.ts tests/flash-archive-action.test.ts
          git commit -m "style(scan): format PR 86 changed files"
          git push origin HEAD:scan-phase-a-interpreter
