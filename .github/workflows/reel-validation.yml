name: Réel Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/reel.lazy.tsx"
      - "src/domains/presence/ui/**"
      - "src/domains/presence/model/**"
      - "src/platform/device/haptics.ts"
      - "tests/presence/**"
      - "tests/mobile-e2e-contract.test.ts"
      - "scripts/test-mobile-e2e.sh"
      - "scripts/check-mobile-scroll.mjs"
      - "package.json"
      - "bun.lock"
      - "eslint.config.js"
      - "tests/vitest.config.ts"
      - ".github/workflows/reel-validation.yml"

permissions:
  contents: read

concurrency:
  group: reel-validation-${{ github.ref }}
  # Never interrupt an active mobile smoke test; keep only one pending run.
  cancel-in-progress: false

jobs:
  reel-focused:
    name: Réel focused lint, tests and SSR/mobile rendering
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed Réel entry and native-control files
        run: |
          bunx eslint \
            src/routes/reel.lazy.tsx \
            src/domains/presence/ui/ReelBottomNav.tsx \
            src/domains/presence/ui/components/ReelHeader.tsx \
            src/platform/device/haptics.ts

      - name: Verify formatting of changed files
        run: |
          bunx prettier --check \
            src/routes/reel.lazy.tsx \
            src/domains/presence/ui/ReelBottomNav.tsx \
            src/domains/presence/ui/components/ReelHeader.tsx \
            src/platform/device/haptics.ts

      - name: Run Réel focused tests
        run: |
          bun run test:run -- \
            tests/presence/reel-architecture.test.ts \
            tests/presence/reel-activity-realtime.service.test.ts \
            tests/presence/reel-activity-projection.test.ts \
            tests/mobile-e2e-contract.test.ts

      - name: Install Chromium for production route smoke
        run: bunx playwright install --with-deps chromium

      - name: Production mobile route smoke tests
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder_000000000000
        run: bun run test:e2e
