name: Format repository

on:
  push:
    branches:
      - chore/p0-foundation

permissions:
  contents: write

jobs:
  format:
    name: Apply Prettier formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/p0-foundation
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format repository
        run: bun run format

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Repository already matches Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format repository with prettier"
          git push origin HEAD:chore/p0-foundation
