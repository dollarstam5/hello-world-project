name: Flash Attachment Validation

on:
  push:
    branches:
      - scan-phase-a-interpreter
    paths:
      - "src/domains/flash/**"
      - "packages/core-db/**"
      - "packages/core-contracts/**"
      - "src/platform/offline/**"
      - "tests/flash-attachment-validation.test.ts"
      - ".github/workflows/flash-attachment-validation.yml"
  pull_request:
    paths:
      - "src/domains/flash/**"
      - "packages/core-db/**"
      - "packages/core-contracts/**"
      - "src/platform/offline/**"
      - "tests/flash-attachment-validation.test.ts"
      - ".github/workflows/flash-attachment-validation.yml"

permissions:
  contents: read

jobs:
  flash-attachment-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed Flash attachment files
        run: >-
          bunx eslint
          src/domains/flash/ui/MyFlashManagement.tsx
          src/domains/flash/ui/FlashAttachmentPreview.tsx
          src/domains/flash/ui/FlashComposerReviewStep.tsx
          src/domains/flash/ui/useFlashComposer.ts
          src/lib/i18n/messages.ts
          packages/core-db/src/schema.ts
          packages/core-db/src/local-media-blobs.ts
          src/platform/offline/index.ts
          tests/flash-attachment-validation.test.ts
          --rule "max-lines: off"
      - name: Run attachment validation tests
        run: bun run test:run -- tests/flash-attachment-validation.test.ts
      - name: Build production bundle
        run: bun run build
