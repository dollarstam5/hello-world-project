name: Temporary Prettier runner (Lot 1)
on:
  push:
    branches:
      - fix/reel-ssr-native-controls
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run Prettier on lint-error files
        run: |
          bunx prettier --write \
            src/components/experience/AppHeader.tsx \
            src/components/experience/HomeFoundation.tsx \
            src/domains/presence/model/useReelProximityController.ts \
            src/domains/presence/ui/components/ReelRadarIdentity.tsx \
            src/domains/presence/ui/components/ReelSettingsPanel.tsx \
            src/domains/scan/hooks/useScanFlow.ts \
            src/lib/communication/CommunicationRuntimeProvider.tsx \
            src/lib/i18n/messages.ts \
            tests/mobile-e2e-contract.test.ts \
            scripts/test-mobile-e2e.sh
      - name: Upload formatted files for review/apply
        uses: actions/upload-artifact@v4
        with:
          name: lot1-prettier-formatted
          path: |
            src/components/experience/AppHeader.tsx
            src/components/experience/HomeFoundation.tsx
            src/domains/presence/model/useReelProximityController.ts
            src/domains/presence/ui/components/ReelRadarIdentity.tsx
            src/domains/presence/ui/components/ReelSettingsPanel.tsx
            src/domains/scan/hooks/useScanFlow.ts
            src/lib/communication/CommunicationRuntimeProvider.tsx
            src/lib/i18n/messages.ts
            tests/mobile-e2e-contract.test.ts
            scripts/test-mobile-e2e.sh
          retention-days: 1
